<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Touriga Chã Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky picker of four versions, then that version's screens in a column, desktop or phone */
:root {
  --bg: #f6f1e7; --surface: #ebe3d4; --fg: #2b241e; --muted: #6b5e52;
  --line: rgba(43,36,30,.16); --accent: #7a2236; --accent-fg: #fbf7f0;
  --display: "Literata", Georgia, serif; --text: "Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1915; --surface: #2a241e; --fg: #f1e9dc; --muted: #b3a593;
  --line: rgba(241,233,220,.16); --accent: #d98a9a; --accent-fg: #1d1915; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1915; --surface: #2a241e; --fg: #f1e9dc; --muted: #b3a593;
  --line: rgba(241,233,220,.16); --accent: #d98a9a; --accent-fg: #1d1915; color-scheme: dark }

html,body{margin:0}
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--text); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.intro { padding-block: 40px 24px; }
h1 { font: 400 clamp(32px, 5vw, 52px)/1.08 var(--display); margin: 0; text-wrap: balance; }
.intro p { color: var(--muted); max-width: 62ch; margin: 12px 0 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 12px; }
.versions { display: flex; flex-wrap: wrap; gap: 8px; }
.versions a, .device button {
  font: 500 15px/1 var(--text); color: var(--fg); text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: transparent; padding: 12px 14px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
}
.versions a[aria-current="page"], .device button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.versions a:hover, .device button:hover { border-color: var(--accent); }
.versions .n { font-variant-numeric: tabular-nums; opacity: .7; }
.device { display: flex; gap: 0; }
.device button + button { border-left: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.about { display: grid; gap: 6px 32px; grid-template-columns: minmax(0, 1fr); padding-block: 28px 8px; }
@media (min-width: 800px) { .about { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.about h2 { font: 400 30px/1.15 var(--display); margin: 0; }
.about .meta { color: var(--muted); font-size: 14px; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.about ul { margin: 0; padding-left: 18px; }
.about li { margin: 4px 0; }

.screens { display: grid; gap: 14px; padding-block: 24px 64px; }
.screens.m { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.screens img { display: block; width: 100%; max-width: 100%; height: auto; border: 1px solid var(--line); background: var(--surface); }
.screens.d img { aspect-ratio: 1440 / 900; }
.screens.m img { aspect-ratio: 390 / 844; }
</style>

</head>
<body>
<header class="wrap intro">
  <h1>Quinta da Touriga Chã, four versions</h1>
  <p>Screens of each version of the site at 1440px desktop and 390px phone, top to bottom as you scroll. Pick a version and a device.</p>
</header>

<div class="bar">
  <div class="wrap">
    <nav class="versions" aria-label="Versions" id="versions"></nav>
    <div class="device" role="group" aria-label="Device">
      <button type="button" id="dev-d" aria-pressed="true">Desktop</button>
      <button type="button" id="dev-m" aria-pressed="false">Phone</button>
    </div>
  </div>
</div>

<main class="wrap">
  <section class="about" id="about" aria-live="polite"></section>
  <div class="screens d" id="screens"></div>
</main>

<script>
const VERSIONS = [
  { id: 'v1', commit: '48b41e3', name: 'Original', d: 14, m: 16,
    when: 'The site as it was before any changes',
    points: ['Dark cinematic look, black and grey with gold', 'WebGL shader and tilted bottles in the wines section', 'Text fades in on scroll', 'The CEO’s original text'] },
  { id: 'v2', commit: '702a54c', name: 'Dark redesign', d: 11, m: 16,
    when: 'First pass with the skill',
    points: ['Same dark palette, one section per screen', 'Split photo and text sections, clean wine cards', 'Real navigation, no scroll fades', 'The CEO’s text, with a few labels added'] },
  { id: 'v3', commit: '30d55cf', name: 'Warm, original text', d: 13, m: 16, current: true,
    when: 'Current version on the branch',
    points: ['Cream ground, brown ink, Puro crimson as the accent', 'Every word restored from the CEO’s original text', 'Terroir as photo chapters, then Viticulture, Winemaking and Winery', 'Family, Founders, Wines, Visit, Allocation enquiry'] },
];
let device = 'd';
try { device = localStorage.getItem('device') || 'd'; } catch (e) {}

const nav = document.getElementById('versions');
nav.innerHTML = VERSIONS.map((v, i) =>
  `<a href="#${v.id}" data-id="${v.id}"><span class="n">${i + 1}</span>${v.name}${v.current ? ' · current' : ''}</a>`).join('');

function current() {
  const id = location.hash.slice(1);
  return VERSIONS.find(v => v.id === id) || VERSIONS[VERSIONS.length - 1];
}
function render() {
  const v = current();
  nav.querySelectorAll('a').forEach(a => { if (a.dataset.id === v.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.getElementById('dev-d').setAttribute('aria-pressed', device === 'd');
  document.getElementById('dev-m').setAttribute('aria-pressed', device === 'm');
  document.getElementById('about').innerHTML =
    `<div><h2>${v.name}</h2><p class="meta">${v.when}${v.current ? '' : ' · commit ' + v.commit}</p></div>
     <ul>${v.points.map(p => `<li>${p}</li>`).join('')}</ul>`;
  const n = v[device];
  const box = document.getElementById('screens');
  box.className = 'screens ' + device;
  box.innerHTML = Array.from({ length: n }, (_, i) => {
    const k = String(i).padStart(2, '0');
    return `<img src="/compare/versions/${v.commit}-${device}-${k}.jpg" alt="${v.name}, ${device === 'd' ? 'desktop' : 'phone'} screen ${i + 1} of ${n}" loading="${i < 3 ? 'eager' : 'lazy'}" width="${device === 'd' ? 1440 : 390}" height="${device === 'd' ? 900 : 844}">`;
  }).join('');
}
function setDevice(d) { device = d; try { localStorage.setItem('device', d); } catch (e) {} render(); }
document.getElementById('dev-d').addEventListener('click', () => setDevice('d'));
document.getElementById('dev-m').addEventListener('click', () => setDevice('m'));
addEventListener('hashchange', render);
render();
</script>

</body>
</html>
